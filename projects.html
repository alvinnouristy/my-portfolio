<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Projects by Alvin Nouristy">
  <meta name="theme-color" content="#0D1117">
  <title>Projects | Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo" style="font-family: 'JetBrains Mono', monospace; font-weight: 700;">Portfolio</a>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu"><span class="hamburger"></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="experience.html" class="nav-link">Experience</a></li>
        <li><a href="projects.html" class="nav-link active">Projects</a></li>
        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section style="padding-top: 2rem; padding-bottom: 1rem;">
    <div class="container">
      <a href="index.html" class="back-link" style="display: inline-flex; align-items: center; gap: 0.5rem; color: #58a6ff; text-decoration: none; margin-bottom: 1rem; font-size: 0.95rem;">
        ← Back to Home
      </a>
      <div style="margin-top: 0.5rem;">
        <h1 style="font-size: 2.2rem; color: #c9d1d9; margin-top: 0.3rem;">My Projects</h1>
        <p style="color: #8b949e; max-width: 600px; margin-top: 0.5rem; font-size: 0.95rem;">A collection of engineering projects showcasing my expertise in embedded systems, automation, and circuit design.</p>
      </div>
    </div>
  </section>

  <section class="projects-section" style="min-height: 40vh;">
    <div class="container">
      <div class="projects-grid" id="projectsGrid"></div>
    </div>
  </section>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const projectsGrid = document.getElementById('projectsGrid');
      if (!window.portfolioUtils) return;
      const projects = window.portfolioUtils.getProjects();
      
      if (projects.length === 0) {
        projectsGrid.innerHTML = '<div style="text-align: center; grid-column: 1 / -1; padding: 3rem; color: #8b949e; background: #161b22; border-radius: 12px; border: 1px solid #30363d;"><h2>No projects available yet.</h2></div>';
        return;
      }

      projectsGrid.innerHTML = projects.map(project => `
        <div class="project-card" style="background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; transition: transform 0.3s ease;">
          <div class="project-header">
            <span class="project-category" style="color: #58a6ff; font-size: 0.875rem; font-weight: 600; text-transform: uppercase;">${project.category || 'General'}</span>
            <h3 class="project-title" style="color: #c9d1d9; font-size: 1.5rem; margin: 0.5rem 0;">${project.title}</h3>
          </div>
          <p class="project-description" style="color: #8b949e; line-height: 1.6; flex-grow: 1;">${project.description}</p>
          <div class="project-tags" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;">
            ${(project.technologies || []).map(tech => `<span style="background: #21262d; color: #c9d1d9; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; border: 1px solid #30363d;">${tech}</span>`).join('')}
          </div>
          <div class="project-footer" style="margin-top: auto;">
            <a href="project-detail.html?id=${project.id}" class="btn btn-primary" style="display: inline-block; width: 100%; text-align: center; background: #238636; color: white; padding: 0.6rem 1rem; border-radius: 6px; text-decoration: none; font-weight: 600;">
              View Details
            </a>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
