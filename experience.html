<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D1117">
  <title>Experience | Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo" style="font-family: 'JetBrains Mono', monospace; font-weight: 700;">Portfolio</a>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu"><span class="hamburger"></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="experience.html" class="nav-link active">Experience</a></li>
        <li><a href="projects.html" class="nav-link">Projects</a></li>
        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section style="padding-top: 2rem; padding-bottom: 1rem;">
    <div class="container">
      <a href="index.html" class="back-link" style="display: inline-flex; align-items: center; gap: 0.5rem; color: #58a6ff; text-decoration: none; margin-bottom: 1rem; font-size: 0.95rem;">
        ← Back to Home
      </a>
      <div style="margin-top: 0.5rem;">
        <h1 style="font-size: 2.2rem; color: #c9d1d9; margin-top: 0.3rem;">My Experience</h1>
        <p style="color: #8b949e; max-width: 600px; margin-top: 0.5rem; font-size: 0.95rem;">A journey of continuous learning, professional growth, and hands-on engineering.</p>
      </div>
    </div>
  </section>

  <section style="padding: 2rem 0 5rem 0; min-height: 40vh;">
    <div class="container" id="experienceContainer" style="max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem;"></div>
  </section>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('experienceContainer');
      if (!window.portfolioUtils) return;

      const experiences = window.portfolioUtils.getExperiences ? window.portfolioUtils.getExperiences() : (window.portfolioUtils.getExperience ? window.portfolioUtils.getExperience() : []);

      if (experiences.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 4rem; color: #8b949e; background: #161b22; border: 1px solid #30363d; border-radius: 12px;"><h2>No experience added yet.</h2></div>';
        return;
      }

      container.innerHTML = experiences.map((exp, index) => {
        let shortDesc = exp.description || "";
        if (shortDesc.length > 120) shortDesc = shortDesc.substring(0, 120) + "...";

        return `
        <div style="background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2rem; position: relative; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.15);">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #58a6ff;"></div>
          
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
            <div>
              <h3 style="color: #c9d1d9; font-size: 1.4rem; margin-bottom: 0.3rem;">${exp.role || exp.title}</h3>
              <h4 style="color: #58a6ff; font-size: 1rem; font-weight: 500; margin-bottom: 0.5rem;">${exp.company}</h4>
              <div style="display: inline-block; background: #21262d; color: #8b949e; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.8rem; border: 1px solid #30363d; margin-bottom: 1.2rem;">
                ${exp.period}
              </div>
            </div>
            
            <a href="experience-detail.html?id=${index}" style="display: inline-block; padding: 0.4rem 1rem; font-size: 0.85rem; font-weight: 500; color: #c9d1d9; background: #21262d; border: 1px solid #30363d; border-radius: 6px; text-decoration: none; transition: all 0.2s ease;" onmouseover="this.style.borderColor='#58a6ff'; this.style.color='#58a6ff';" onmouseout="this.style.borderColor='#30363d'; this.style.color='#c9d1d9';">
              Details →
            </a>
          </div>
          
          <p style="color: #8b949e; line-height: 1.6; margin-bottom: 0; font-size: 0.95rem;">${shortDesc}</p>
        </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
