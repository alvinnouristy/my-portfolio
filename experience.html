<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Professional and Organizational Experience">
  <meta name="theme-color" content="#0D1117">
  <title>Experience | Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo" style="font-family: 'JetBrains Mono', monospace; font-weight: 700;">Portfolio</a>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu"><span class="hamburger"></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="experience.html" class="nav-link active">Experience</a></li>
        <li><a href="projects.html" class="nav-link">Projects</a></li>
        <li><a href="index.html#contact" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section style="padding-top: 2rem; padding-bottom: 1rem;">
    <div class="container">
      <a href="index.html" class="back-link" style="display: inline-flex; align-items: center; gap: 0.5rem; color: #58a6ff; text-decoration: none; margin-bottom: 1rem; font-size: 0.95rem;">
        ← Back to Home
      </a>
      <div style="margin-top: 0.5rem;">
        <h1 style="font-size: 2.2rem; color: #c9d1d9; margin-top: 0.3rem;">Experience</h1>
        <p style="color: #8b949e; max-width: 600px; margin-top: 0.5rem; font-size: 0.95rem;">Perjalanan karir, magang, serta pengalaman organisasi profesional saya.</p>
      </div>
    </div>
  </section>

  <section class="experience-section" style="min-height: 50vh;">
    <div class="container">
      <div class="timeline" id="experienceTimeline" style="display: flex; flex-direction: column; gap: 2rem;">
        </div>
    </div>
  </section>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const timeline = document.getElementById('experienceTimeline');
      if (!window.portfolioUtils) return;
      
      const expFunction = window.portfolioUtils.getExperiences || window.portfolioUtils.getExperience;
      let experiences = expFunction ? expFunction() : [];
      
      if (experiences.length === 0) {
        timeline.innerHTML = '<div style="text-align: center; padding: 3rem; color: #8b949e; background: #161b22; border-radius: 12px; border: 1px solid #30363d;"><h2>Belum ada riwayat pengalaman.</h2></div>';
        return;
      }

      // ========================================================
      // LOGIKA AUTOMATIC SORTING (URUTAN TANGGAL TERBARU DI ATAS)
      // ========================================================
      function parseLatestYear(periodStr) {
        if (!periodStr) return 0;
        const text = periodStr.toLowerCase();
        
        if (text.includes('present') || text.includes('saat ini') || text.includes('sekarang')) {
          return 9999; 
        }
        
        const years = periodStr.match(/\d{4}/g);
        if (years) {
          return Math.max(...years.map(Number));
        }
        return 0;
      }

      // KUNCI INDEX ASLI: Menambahkan originalIndex sebelum data diurutkan 
      // agar link detail mengarah ke item yang benar di Local Storage
      const experiencesWithIndex = experiences.map((exp, originalIndex) => ({
        ...exp,
        originalIndex
      }));

      // Melakukan pengurutan secara otomatis berdasarkan tahun terbaru
      experiencesWithIndex.sort((a, b) => parseLatestYear(b.period) - parseLatestYear(a.period));

      // Menampilkan data ke dalam timeline list
      timeline.innerHTML = experiencesWithIndex.map((exp) => {
        return `
        <div style="background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.5rem;">
            <div>
              <span style="color: #58a6ff; font-size: 0.85rem; font-weight: 600; text-transform: uppercase;">${exp.company || 'Company'}</span>
              <h3 style="color: #c9d1d9; font-size: 1.4rem; margin: 0.2rem 0;">${exp.title || exp.role}</h3>
            </div>
            <span style="background: #21262d; color: #8b949e; padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.85rem; border: 1px solid #30363d; font-weight: 500;">
              ${exp.period || ''}
            </span>
          </div>
          <p style="color: #8b949e; line-height: 1.6; margin: 0.5rem 0; text-align: justify;">
            ${exp.description ? (exp.description.length > 130 ? exp.description.substring(0, 130) + '...' : exp.description) : ''}
          </p>
          <div style="margin-top: 0.5rem;">
            <a href="experience-detail.html?id=${exp.originalIndex}" style="display: inline-block; background: #238636; color: white; padding: 0.5rem 1.2rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: background 0.2s;">
              View Details
            </a>
          </div>
        </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
