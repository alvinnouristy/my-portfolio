<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - Manage Portfolio | Alvin Nouristy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .admin-container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-top: 5rem; }
    .admin-title { font-size: 1.75rem; font-weight: 700; color: var(--foreground); }
    .project-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
    .project-list-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); }
    .project-list-info h3 { font-size: 1rem; font-weight: 600; color: var(--foreground); margin-bottom: 0.25rem; }
    .project-list-info p { font-size: 0.8rem; color: var(--foreground-muted); }
    .project-list-actions { display: flex; gap: 0.5rem; }
    .btn-small { padding: 0.5rem 1rem; font-size: 0.8rem; }
    .btn-danger { background: rgba(248, 81, 73, 0.1); color: var(--error); border: 1px solid rgba(248, 81, 73, 0.3); }
    .btn-danger:hover { background: var(--error); color: white; }
    .form-section { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 2rem; margin-bottom: 2rem; }
    .form-section-title { font-size: 1.25rem; font-weight: 600; color: var(--foreground); margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--card-border); }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .array-input { display: flex; flex-direction: column; gap: 0.5rem; }
    .array-item { display: flex; gap: 0.5rem; }
    .array-item input { flex: 1; }
    .btn-remove { padding: 0.5rem; background: rgba(248, 81, 73, 0.1); color: var(--error); border: none; border-radius: var(--radius-sm); cursor: pointer; }
    .btn-add { padding: 0.5rem 1rem; background: rgba(0, 217, 255, 0.1); color: var(--primary); border: 1px dashed var(--primary); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.8rem; margin-top: 0.5rem; }
    .form-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--card-border); }
    .hidden { display: none !important; }
    .tab-buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
    .tab-btn { padding: 0.5rem 1rem; background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); color: var(--foreground-muted); cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem; }
    .tab-btn.active { background: var(--primary); color: var(--background); border-color: var(--primary); }
    .image-drop-zone { border: 2px dashed var(--card-border, #444); border-radius: 8px; padding: 2rem; text-align: center; transition: all 0.3s ease; background: var(--background, #111); margin-bottom: 1rem; }
    .image-drop-zone:hover { border-color: var(--primary, #00d9ff); background: rgba(0, 217, 255, 0.05); }
    .upload-link { color: var(--primary, #00d9ff); cursor: pointer; text-decoration: underline; font-weight: bold; }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo" style="font-family: 'JetBrains Mono', monospace; font-weight: 700;">
        Portfolio
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="projects.html" class="nav-link">Projects</a></li>
      </ul>
    </div>
  </nav>

  <main class="admin-container">
    <div class="admin-header">
      <h1 class="admin-title">Admin Dashboard</h1>
    </div>
    
    <!-- TABS MENU -->
    <div class="tab-buttons">
      <button id="listBtn" class="tab-btn active" onclick="showTab('list')">Projects</button>
      <button id="formBtn" class="tab-btn" onclick="showTab('form')">+ Project</button>
      <button id="skillsListBtn" class="tab-btn" onclick="showTab('skillsList')">Skills</button>
      <button id="skillFormBtn" class="tab-btn" onclick="showTab('skillForm')">+ Skill</button>
      <button id="expListBtn" class="tab-btn" onclick="showTab('expList')">Experiences</button>
      <button id="expFormBtn" class="tab-btn" onclick="showTab('expForm')">+ Experience</button>
      <button id="messagesBtn" class="tab-btn" onclick="showTab('messages')">Messages</button>
    </div>
    
    <!-- 1. PROJECT LIST TAB -->
    <div id="listTab" class="tab-content">
      <div class="project-list" id="adminProjectList"></div>
    </div>
    
    <!-- 2. PROJECT FORM TAB -->
    <div id="formTab" class="tab-content hidden">
      <form id="projectForm">
        <div class="form-section">
          <h2 class="form-section-title">Basic Information</h2>
          <div class="form-group"><label class="form-label">Project Title *</label><input type="text" id="title" class="form-input" required></div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Category *</label>
              <select id="category" class="form-input" required>
                <option value="IoT">IoT</option><option value="Automation">Automation</option><option value="Circuit Design">Circuit Design</option>
                <option value="SCADA">SCADA</option><option value="Embedded Systems">Embedded Systems</option><option value="Power Electronics">Power Electronics</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Date *</label><input type="month" id="date" class="form-input" required></div>
          </div>
          <div class="form-group"><label class="form-label">Short Description *</label><textarea id="description" class="form-textarea" rows="2" required></textarea></div>
          <div class="form-group"><label class="form-label">Full Overview *</label><textarea id="overview" class="form-textarea" rows="4" required></textarea></div>
        </div>
        <div class="form-section">
          <h2 class="form-section-title">Arrays & Info</h2>
          <div style="margin-bottom: 1rem;"><label class="form-label">Technologies</label><div class="array-input" id="technologiesContainer"></div><button type="button" class="btn-add" onclick="addArrayItem('technologies')">+ Tech</button></div>
          <div style="margin-bottom: 1rem;"><label class="form-label">Features</label><div class="array-input" id="featuresContainer"></div><button type="button" class="btn-add" onclick="addArrayItem('features')">+ Feature</button></div>
        </div>
        <div class="form-section">
          <h2 class="form-section-title">Images</h2>
          <div class="image-drop-zone" id="imageDropZone"><p>Drag & drop images here or <label for="imageInput" class="upload-link">Browse</label></p><input type="file" id="imageInput" accept="image/*" multiple style="display: none;"></div>
          <div class="image-preview-grid" id="imagePreviewGrid"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="resetProjectForm()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Project</button>
        </div>
      </form>
    </div>

    <!-- 3. SKILLS LIST TAB -->
    <div id="skillsListTab" class="tab-content hidden">
      <div class="form-section"><h2 class="form-section-title">Manage My Skills</h2><div class="project-list" id="adminSkillList"></div></div>
    </div>

    <!-- 4. SKILL FORM TAB -->
    <div id="skillFormTab" class="tab-content hidden">
      <form id="skillFormElement">
        <div class="form-section">
          <h2 class="form-section-title">Skill Detail</h2>
          <div class="form-group"><label class="form-label">Skill Title *</label><input type="text" id="skillTitle" class="form-input" required></div>
          <div class="form-group"><label class="form-label">Description *</label><textarea id="skillDescription" class="form-textarea" rows="3" required></textarea></div>
          <div class="form-group"><label class="form-label">Icon (SVG Code)</label><textarea id="skillIconSvg" class="form-textarea" rows="3" placeholder="<svg>...</svg>"></textarea></div>
          <div class="form-group" style="margin-top: 1rem;"><label class="form-label">Tags (Sub-skills)</label><div class="array-input" id="skillTagsContainer"></div><button type="button" class="btn-add" onclick="addArrayItem('skillTags')">+ Add Tag</button></div>
        </div>
        <div class="form-actions"><button type="button" class="btn btn-secondary" onclick="resetSkillForm()">Cancel</button><button type="submit" class="btn btn-primary">Save Skill</button></div>
      </form>
    </div>

    <!-- 5. EXPERIENCES LIST TAB (NEW) -->
    <div id="expListTab" class="tab-content hidden">
      <div class="form-section"><h2 class="form-section-title">Manage Experiences</h2><div class="project-list" id="adminExpList"></div></div>
    </div>

    <!-- 6. EXPERIENCE FORM TAB (NEW) -->
    <div id="expFormTab" class="tab-content hidden">
      <form id="expFormElement">
        <div class="form-section">
          <h2 class="form-section-title">Experience Detail</h2>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Role / Title *</label><input type="text" id="expRole" class="form-input" required placeholder="e.g. Electrical Engineer"></div>
            <div class="form-group"><label class="form-label">Company / Institution *</label><input type="text" id="expCompany" class="form-input" required placeholder="e.g. PT. Inovasi Tech"></div>
          </div>
          <div class="form-group"><label class="form-label">Period *</label><input type="text" id="expPeriod" class="form-input" required placeholder="e.g. Jan 2023 - Present"></div>
          <div class="form-group"><label class="form-label">Short Description</label><textarea id="expDescription" class="form-textarea" rows="2"></textarea></div>
          <div class="form-group" style="margin-top: 1rem;">
            <label class="form-label">Key Responsibilities (Bullets)</label>
            <div class="array-input" id="expRespContainer"></div>
            <button type="button" class="btn-add" onclick="addArrayItem('expResp')">+ Add Responsibility</button>
          </div>
        </div>
        <div class="form-actions"><button type="button" class="btn btn-secondary" onclick="resetExpForm()">Cancel</button><button type="submit" class="btn btn-primary">Save Experience</button></div>
      </form>
    </div>
    
    <!-- 7. MESSAGES TAB -->
    <div id="messagesTab" class="tab-content hidden">
      <div class="messages-section">
        <div class="messages-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;"><h2 style="color: var(--foreground); font-size: 1.25rem;">Contact Messages</h2><button class="btn btn-danger btn-small" onclick="clearAllMessages()">Clear All</button></div>
        <div class="messages-grid" id="messagesContainer"></div>
      </div>
    </div>
    
  </main>

  <script src="js/main.js"></script>
  <script>
    let editingProjectId = null, editingSkillId = null, editingExpId = null, uploadedImages = []; 
    
    document.addEventListener('DOMContentLoaded', () => {
      if(window.portfolioUtils) {
        loadProjectList(); loadSkillsList(); loadExpList(); loadMessages();
      }
      initForms();
      
      document.getElementById('projectForm').addEventListener('submit', saveProjectAction);
      document.getElementById('skillFormElement').addEventListener('submit', saveSkillAction);
      document.getElementById('expFormElement').addEventListener('submit', saveExpAction);
      
      const imageInput = document.getElementById('imageInput');
      imageInput.addEventListener('change', (e) => { if(e.target.files.length > 0) handleFiles(Array.from(e.target.files)); e.target.value = ''; });
      const dropZone = document.getElementById('imageDropZone');
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--primary)'; });
      dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.style.borderColor = ''; });
      dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.style.borderColor = ''; if (e.dataTransfer.files) handleFiles(Array.from(e.dataTransfer.files)); });
    });

    // --- TAB MANAGEMENT ---
    function showTab(tab) {
      const allTabs = ['list', 'form', 'skillsList', 'skillForm', 'expList', 'expForm', 'messages'];
      allTabs.forEach(t => {
        document.getElementById(t + 'Btn').classList.toggle('active', t === tab);
        document.getElementById(t + 'Tab').classList.toggle('hidden', t !== tab);
      });
      if (tab === 'messages') loadMessages();
      if (tab === 'list') loadProjectList();
      if (tab === 'skillsList') loadSkillsList();
      if (tab === 'expList') loadExpList();
    }

    function notify(msg, type) { if (window.portfolioUtils) window.portfolioUtils.showToast(msg, type); else alert(msg); }
    function generateId(title) { return title.toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, '-').slice(0, 50); }

    function initForms() {
      addArrayItem('technologies'); addArrayItem('features'); addArrayItem('skillTags'); addArrayItem('expResp');
    }

    function addArrayItem(prefix, value = '') {
      const container = document.getElementById(`${prefix}Container`);
      const div = document.createElement('div'); div.className = 'array-item';
      div.innerHTML = `<input type="text" class="form-input" value="${value}" placeholder="Enter detail..."><button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button>`;
      container.appendChild(div);
    }

    function getArrayValues(prefix) {
      const container = document.getElementById(`${prefix}Container`);
      if(!container) return [];
      return Array.from(container.querySelectorAll('input')).map(inp => inp.value.trim()).filter(val => val);
    }

    // --- EXPERIENCE MANAGEMENT (NEW) ---
    function loadExpList() {
      if(!window.portfolioUtils) return;
      const exps = window.portfolioUtils.getExperiences();
      document.getElementById('adminExpList').innerHTML = exps.map(e => `
        <div class="project-list-item">
          <div class="project-list-info"><h3>${e.role}</h3><p>${e.company} | ${e.period}</p></div>
          <div class="project-list-actions">
            <button class="btn btn-secondary btn-small" onclick="editExp('${e.id}')">Edit</button>
            <button class="btn btn-danger btn-small" onclick="deleteExp('${e.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function editExp(id) {
      if(!window.portfolioUtils) return;
      const e = window.portfolioUtils.getExperienceById(id);
      if(!e) return;
      editingExpId = id;
      document.getElementById('expRole').value = e.role;
      document.getElementById('expCompany').value = e.company;
      document.getElementById('expPeriod').value = e.period;
      document.getElementById('expDescription').value = e.description || '';
      document.getElementById('expRespContainer').innerHTML = '';
      (e.responsibilities || []).forEach(val => addArrayItem('expResp', val));
      if (!e.responsibilities?.length) addArrayItem('expResp');
      showTab('expForm');
    }

    function saveExpAction(e) {
      e.preventDefault();
      const exp = {
        id: editingExpId || generateId(document.getElementById('expRole').value + '-' + document.getElementById('expCompany').value),
        role: document.getElementById('expRole').value,
        company: document.getElementById('expCompany').value,
        period: document.getElementById('expPeriod').value,
        description: document.getElementById('expDescription').value,
        responsibilities: getArrayValues('expResp')
      };
      window.portfolioUtils.saveExperience(exp);
      notify('Experience saved!', 'success');
      resetExpForm(); showTab('expList');
    }

    function deleteExp(id) {
      if (confirm('Delete this experience?')) {
        window.portfolioUtils.deleteExperience(id);
        notify('Experience deleted', 'success'); loadExpList();
      }
    }

    function resetExpForm() {
      editingExpId = null; document.getElementById('expFormElement').reset();
      document.getElementById('expRespContainer').innerHTML = ''; addArrayItem('expResp');
    }

    // --- SKILLS MANAGEMENT ---
    function loadSkillsList() {
      if(!window.portfolioUtils) return;
      document.getElementById('adminSkillList').innerHTML = window.portfolioUtils.getSkills().map(skill => `
        <div class="project-list-item"><div class="project-list-info"><h3>${skill.title}</h3><p>${(skill.tags || []).join(', ')}</p></div><div class="project-list-actions"><button class="btn btn-secondary btn-small" onclick="editSkill('${skill.id}')">Edit</button><button class="btn btn-danger btn-small" onclick="deleteSkill('${skill.id}')">Delete</button></div></div>
      `).join('');
    }
    function editSkill(id) {
      if(!window.portfolioUtils) return;
      const skill = window.portfolioUtils.getSkillById(id);
      if(!skill) return;
      editingSkillId = id; document.getElementById('skillTitle').value = skill.title; document.getElementById('skillDescription').value = skill.description; document.getElementById('skillIconSvg').value = skill.iconSvg || ''; document.getElementById('skillTagsContainer').innerHTML = '';
      (skill.tags || []).forEach(val => addArrayItem('skillTags', val)); if (!skill.tags?.length) addArrayItem('skillTags'); showTab('skillForm');
    }
    function saveSkillAction(e) {
      e.preventDefault();
      const skill = { id: editingSkillId || generateId(document.getElementById('skillTitle').value), title: document.getElementById('skillTitle').value, description: document.getElementById('skillDescription').value, iconSvg: document.getElementById('skillIconSvg').value, tags: getArrayValues('skillTags') };
      window.portfolioUtils.saveSkill(skill); notify('Skill saved!', 'success'); resetSkillForm(); showTab('skillsList');
    }
    function deleteSkill(id) { if (confirm('Delete skill?')) { window.portfolioUtils.deleteSkill(id); notify('Skill deleted', 'success'); loadSkillsList(); } }
    function resetSkillForm() { editingSkillId = null; document.getElementById('skillFormElement').reset(); document.getElementById('skillTagsContainer').innerHTML = ''; addArrayItem('skillTags'); }

    // --- PROJECTS MANAGEMENT ---
    function loadProjectList() {
      if(!window.portfolioUtils) return;
      document.getElementById('adminProjectList').innerHTML = window.portfolioUtils.getProjects().map(project => `
        <div class="project-list-item"><div class="project-list-info"><h3>${project.title}</h3><p>${project.category} | ${project.date}</p></div><div class="project-list-actions"><button class="btn btn-secondary btn-small" onclick="editProject('${project.id}')">Edit</button><button class="btn btn-danger btn-small" onclick="deleteProject('${project.id}')">Delete</button></div></div>
      `).join('');
    }
    function editProject(id) {
      if(!window.portfolioUtils) return; const p = window.portfolioUtils.getProjectById(id); if (!p) return;
      editingProjectId = id; document.getElementById('title').value = p.title; document.getElementById('category').value = p.category; document.getElementById('description').value = p.description; document.getElementById('overview').value = p.overview; document.getElementById('date').value = p.date;
      ['technologies', 'features'].forEach(t => { document.getElementById(`${t}Container`).innerHTML = ''; (p[t] || []).forEach(v => addArrayItem(t, v)); if (!p[t]?.length) addArrayItem(t); });
      uploadedImages = Array.isArray(p.images) ? [...p.images] : []; renderImagePreviews(); showTab('form');
    }
    function saveProjectAction(e) {
      e.preventDefault();
      const project = { id: editingProjectId || generateId(document.getElementById('title').value), title: document.getElementById('title').value, category: document.getElementById('category').value, description: document.getElementById('description').value, overview: document.getElementById('overview').value, date: document.getElementById('date').value, technologies: getArrayValues('technologies'), features: getArrayValues('features'), images: uploadedImages };
      window.portfolioUtils.saveProject(project); notify('Project saved!', 'success'); resetProjectForm(); showTab('list');
    }
    function deleteProject(id) { if (confirm('Delete project?')) { window.portfolioUtils.deleteProject(id); notify('Deleted', 'success'); loadProjectList(); } }
    function resetProjectForm() { editingProjectId = null; uploadedImages = []; document.getElementById('projectForm').reset(); renderImagePreviews(); ['technologies', 'features'].forEach(t => { document.getElementById(`${t}Container`).innerHTML = ''; addArrayItem(t); }); }

    // --- IMAGES ---
    function handleFiles(files) { files.forEach(f => { if (!f.type.startsWith('image/')) return notify(`Bukan gambar!`, 'error'); if (f.size > 5 * 1024 * 1024) return notify(`Max 5MB!`, 'error'); const r = new FileReader(); r.onload = (e) => { uploadedImages.push({ url: e.target.result, caption: f.name }); renderImagePreviews(); }; r.readAsDataURL(f); }); }
    function renderImagePreviews() { const grid = document.getElementById('imagePreviewGrid'); grid.innerHTML = ''; if (uploadedImages.length > 0) { grid.style.display = 'flex'; grid.style.gap = '10px'; grid.style.flexWrap = 'wrap'; grid.style.marginTop = '1rem'; } uploadedImages.forEach((img, i) => { const div = document.createElement('div'); div.style.position = 'relative'; div.style.width = '100px'; div.style.height = '100px'; div.style.borderRadius = '8px'; div.style.overflow = 'hidden'; div.style.border = '1px solid #444'; div.innerHTML = `<img src="${img.url}" style="width: 100%; height: 100%; object-fit: cover;"><button type="button" onclick="removeImage(${i})" style="position: absolute; top: 4px; right: 4px; background: #f85149; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer;">X</button>`; grid.appendChild(div); }); }
    function removeImage(i) { uploadedImages.splice(i, 1); renderImagePreviews(); }

    // --- MESSAGES VIEWER ---
    function loadMessages() { const msgs = JSON.parse(localStorage.getItem('contactMessages') || '[]'); const cont = document.getElementById('messagesContainer'); if (msgs.length === 0) return cont.innerHTML = '<div class="no-messages"><p>No messages yet.</p></div>'; msgs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)); cont.innerHTML = msgs.map((msg, idx) => `<div class="message-card"><div class="message-header"><div><div class="message-from">${escapeHtml(msg.from_name)}</div><div class="message-email">${escapeHtml(msg.from_email)}</div></div><span class="message-status ${msg.status}">${msg.status}</span></div><div class="message-content">${escapeHtml(msg.message)}</div><div class="message-actions"><a href="mailto:${escapeHtml(msg.from_email)}" class="btn btn-primary btn-small">Reply</a><button class="btn btn-danger btn-small" onclick="deleteMessage(${idx})">Delete</button></div></div>`).join(''); }
    function deleteMessage(i) { const msgs = JSON.parse(localStorage.getItem('contactMessages') || '[]'); msgs.splice(i, 1); localStorage.setItem('contactMessages', JSON.stringify(msgs)); loadMessages(); notify('Message deleted', 'success'); }
    function clearAllMessages() { if(confirm('Delete all messages?')) { localStorage.setItem('contactMessages', '[]'); loadMessages(); } }
    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
  </script>
</body>
</html>
